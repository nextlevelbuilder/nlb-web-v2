# Publishes @nextlevelbuilder/contracts, @nextlevelbuilder/cli and @nextlevelbuilder/mcp to npm.
#
# Trigger: push a tag `packages-v<version>` from main, where <version> equals the version in all three
# packages/*/package.json. workflow_dispatch builds and packs without publishing.
#
# Publishing uses npm trusted publishing (OIDC), no token. Each package's trusted publisher on
# npmjs.com must name repository nextlevelbuilder/nlb-web-v2 and workflow file release-packages.yml.
name: Release packages

on:
  push:
    tags:
      - "packages-v*"
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release ref
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            for package in contracts cli mcp; do
              version=$(node -p "require('./packages/$package/package.json').version")
              test "$GITHUB_REF_NAME" = "packages-v$version"
            done
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.0

      - run: npm ci

      - name: Build, test and typecheck packages
        run: |
          npm run build:packages
          npm run test:packages
          npm run type-check:packages

      - name: Pack release artifacts
        shell: bash
        run: |
          mkdir -p dist/release
          for package in contracts cli mcp; do
            npm pack -w "@nextlevelbuilder/$package" --pack-destination "$GITHUB_WORKSPACE/dist/release"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/release/*.tgz
          if-no-files-found: error

      - name: Publish to npm with OIDC
        if: github.event_name == 'push'
        shell: bash
        run: |
          for package in contracts cli mcp; do
            npm publish dist/release/nextlevelbuilder-$package-*.tgz --access public --provenance
          done
